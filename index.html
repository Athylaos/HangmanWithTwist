<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="script.js" defer></script>
  <link rel="stylesheet" href="style.css"/>
  <title>Řetězová Šibenice</title>
</head>
<body>
  <div class="game-container">
    <header>
      <h1>Řetězová Šibenice</h1>
    </header>

    <section>
      <div id="secret-word-container" class="secret-word">
        <div class="letter-box">Č</div>
        <div class="letter-box"></div>
        <div class="letter-box"></div>
      </div>
      <p class="stats">Pokusy: <span id="lives-count">4</span> / 10</p>
    </section>

    <section class="hangman-visual">
      <svg id="hangman-svg" viewBox="0 0 200 200" width="200" height="200">
        <line x1="20" y1="180" x2="100" y2="180" />
        <line x1="60" y1="180" x2="60" y2="20" />
        <!--JS generated-->
      </svg>
    </section>

    <section class="word-chain-section">
      <h2>Tvoje slova</h2>
      <div id="word-chain-container" class="chain-container">
        <div class="chain-row completed">
          <span class="word-label">KOČKA</span>
          <span class="picked-badge">Hádané: Č</span>
        </div>
        <!--JS generated-->

        <div class="chain-row">
          <span style="font-size: 0.85rem; color: #64748b; width: 100%;">Vyber písmeno ze slova:</span>
          <div class="letters-picker">
            <button class="letter-btn">Č</button>
            <button class="letter-btn">O</button>
            <!--JS generated-->
          </div>
        </div>

        <div class="chain-row">
          <input type="text" class="word-input" placeholder="Napiš slovo..." />
          <button class="btn">Potvrdit</button>
        </div>

      </div>
    </section>

    <div id="message-box" class="message-box win">
      Písmeno <strong>Č</strong> se v tajence nachází!
    </div>
  </div>
</body>
</html>
